<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

let px,items,score,lives,best=0,run=false,spawn,dir=0,target=null,last=0,lvl=1,mag=0,dbl=0,banner=0,mute=false,ac;
try{best=+localStorage.getItem('ctc_best')||0}catch(e){}
$('bs').textContent=best;
const PW=76,PH=60,CH=130,BT=H-84;
function beep(f,d,tp){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tp||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function vib(n){if(!mute)try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function bg(){const h=210-lvl*10;cv.style.background='linear-gradient(hsl('+h+',80%,70%),hsl('+h+',80%,88%))'}
function reset(){px=W/2;items=[];score=0;lives=3;spawn=0;target=null;lvl=1;mag=0;dbl=0;banner=0;bg();ui()}
function ui(){$('sc').textContent=score;$('lv').textContent=lvl;$('li').textContent='❤'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(3-lives,0));$('bs').textContent=best}
function start(){reset();run=true;$('ov').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function over(){
  run=false;if(score>best){best=score;try{localStorage.setItem('ctc_best',best)}catch(e){}}
  ui();$('ov').classList.remove('hide');
  $('ov').innerHTML='<h1>GAME OVER</h1><p>SCORE: <b>'+score+'</b> · LEVEL: <b>'+lvl+'</b> · BEST: <b>'+best+'</b></p><button id="go">PLAY AGAIN</button>';

}
$('go').onclick=start;
$('M').onclick=()=>{mute=!mute;$('M').textContent=mute?'🔇':'🔊'};
function add(){
  const r=Math.random(),bp=Math.min(.1+lvl*.04,.38),o={x:22+Math.random()*(W-44),y:-24,r:18,rot:Math.random()*6};
  if(r<bp)o.t='bomb';else if(r<bp+.07)o.t=Math.random()<.5?'mag':'dbl';else o.t='coin';
  items.push(o);
}
function loop(now){
  if(!run)return;
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(target!==null){const d=target-px;px+=Math.sign(d)*Math.min(Math.abs(d),520*dt)}else px+=dir*300*dt;
  px=Math.max(PW/2,Math.min(W-PW/2,px));
  mag=Math.max(0,mag-dt);dbl=Math.max(0,dbl-dt);banner=Math.max(0,banner-dt);
  spawn-=dt;
  if(spawn<=0){add();spawn=Math.max(.4,1-lvl*.07)}
  const sp=130+lvl*22,py=BT-6;
  for(let i=items.length-1;i>=0;i--){
    const c=items[i];c.y+=sp*dt;c.rot+=dt*4;
    if(mag>0&&c.t!=='bomb'&&c.y>120)c.x+=Math.sign(px-c.x)*Math.min(Math.abs(px-c.x),170*dt);
    if(c.y+c.r>=py&&c.y<py+PH*.6&&Math.abs(c.x-px)<PW/2+c.r*.5){
      items.splice(i,1);
      if(c.t==='coin'){score+=dbl>0?2:1;beep(880,.08);
        const nl=1+Math.floor(score/10);if(nl>lvl){lvl=nl;banner=1.5;bg();beep(523,.12);setTimeout(()=>beep(784,.18),120)}}
      else if(c.t==='bomb'){lives--;vib(200);beep(110,.3,'sawtooth');if(lives<=0){ui();draw();over();return}}
      else{if(c.t==='mag')mag=8;else dbl=8;beep(1200,.15,'triangle');vib(40)}
      ui();
    }else if(c.y>H+24){
      items.splice(i,1);
      if(c.t==='coin'){lives--;beep(200,.2,'square');vib(60);ui();if(lives<=0){draw();over();return}}
    }
  }
  draw();requestAnimationFrame(loop);
}
function draw(){
  x.clearRect(0,0,W,H);
  // Bright sky
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1597f0');g.addColorStop(.72,'#73cdf3');g.addColorStop(1,'#c7efff');x.fillStyle=g;x.fillRect(0,0,W,H);
  // Clouds
  function cloud(cx,cy,sc){x.save();x.fillStyle='#ffffffd8';for(const [dx,dy,r] of [[-24,4,16],[0,-5,23],[23,5,17],[5,10,22]]){x.beginPath();x.arc(cx+dx*sc,cy+dy*sc,r*sc,0,Math.PI*2);x.fill()}x.restore()}
  cloud(40,70,.7);cloud(315,105,.65);cloud(38,360,.9);cloud(320,390,.8);cloud(45,470,.55);cloud(310,470,.6);
  // DLICOM watermark
  x.save();x.fillStyle='#ffffff42';x.textAlign='center';x.textBaseline='middle';x.font='900 72px Arial';x.fillText('DLICOM',W/2,H*.30);x.restore();
  // Simple city/park silhouette
  x.save();x.globalAlpha=.32;x.fillStyle='#3f82b6';
  for(let i=0;i<11;i++){const bw=18+(i%3)*7,bh=25+(i%5)*13,bx=i*36-8;x.fillRect(bx,H-55-bh,bw,bh)}
  x.strokeStyle='#397da9';x.lineWidth=2;for(const yy of [H-110,H-145]){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy+10);x.stroke()}
  x.restore();
  // Ground
  x.fillStyle='#6ebd53';x.fillRect(0,H-48,W,48);x.fillStyle='#d9bd6a';x.fillRect(0,H-32,W,32);
  // Falling objects
  for(const c of items){
    if(c.t==='coin'){
      const w=Math.max(Math.abs(Math.cos(c.rot))*c.r,3);
      x.save();x.shadowColor='#ffe65a';x.shadowBlur=12;
      x.fillStyle='#f6a900';x.beginPath();x.ellipse(c.x,c.y,w+4,c.r+4,0,0,Math.PI*2);x.fill();
      x.shadowBlur=0;x.fillStyle='#ffd42b';x.beginPath();x.ellipse(c.x,c.y,w,c.r,0,0,Math.PI*2);x.fill();
      x.strokeStyle='#fff3a0';x.lineWidth=2;x.stroke();
      x.save();x.beginPath();x.ellipse(c.x,c.y,w*.78,c.r*.78,0,0,Math.PI*2);x.clip();
      if(logo.complete)x.drawImage(logo,c.x-w*.78,c.y-c.r*.78,w*1.56,c.r*1.56);x.restore();x.restore();
    }else if(c.t==='bomb'){
      x.fillStyle='#171821';x.shadowColor='#ff334d';x.shadowBlur=10;x.beginPath();x.arc(c.x,c.y,c.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font='bold 19px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('☠',c.x,c.y+1);x.strokeStyle='#999';x.lineWidth=3;x.beginPath();x.moveTo(c.x+8,c.y-14);x.quadraticCurveTo(c.x+16,c.y-24,c.x+22,c.y-20);x.stroke();x.fillStyle='#ffd22e';x.beginPath();x.arc(c.x+22,c.y-20,4,0,Math.PI*2);x.fill();
    }else{
      x.fillStyle='#fff';x.beginPath();x.arc(c.x,c.y,c.r,0,Math.PI*2);x.fill();x.strokeStyle=c.t==='mag'?'#e5383b':'#f4a000';x.lineWidth=3;x.stroke();x.font='20px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(c.t==='mag'?'🧲':'⭐',c.x,c.y+1);
    }
  }
  // Character
  if(img.complete&&img.width){const cw=CH*img.width/img.height;x.fillStyle='#00000022';x.beginPath();x.ellipse(px,H-5,cw*.6,5,0,0,Math.PI*2);x.fill();x.drawImage(img,px-cw/2,H-6-CH,cw,CH)}
  // Basket + hands, positioned naturally in front of character
  const bw=82,bh=38,bx=px-bw/2,bt=BT-2;
  x.save();x.lineJoin='round';
  // Basket body
  const basket=x.createLinearGradient(0,bt,0,bt+bh);basket.addColorStop(0,'#d99643');basket.addColorStop(1,'#8f4f20');x.fillStyle=basket;x.beginPath();x.moveTo(bx+3,bt+5);x.quadraticCurveTo(px,bt-1,bx+bw-3,bt+5);x.lineTo(bx+bw-11,bt+bh);x.quadraticCurveTo(px,bt+bh+5,bx+11,bt+bh);x.closePath();x.fill();
  x.strokeStyle='#6e3917';x.lineWidth=2;x.stroke();
  // basket weave
  x.strokeStyle='#b96f2b';x.lineWidth=1.4;for(let i=1;i<7;i++){const xx=bx+i*bw/7;x.beginPath();x.moveTo(xx,bt+5);x.lineTo(bx+10+i*(bw-20)/7,bt+bh-2);x.stroke()}for(let j=1;j<4;j++){x.beginPath();x.moveTo(bx+8,bt+j*9);x.quadraticCurveTo(px,bt+j*9+3,bx+bw-8,bt+j*9);x.stroke()}
  // Thick rim
  x.fillStyle=mag>0?'#e5383b':dbl>0?'#f4a000':'#7d431b';x.beginPath();x.roundRect(bx-5,bt-3,bw+10,9,5);x.fill();x.strokeStyle='#4e2b12';x.lineWidth=1.5;x.stroke();
  // Hands gripping the rim
  for(const d of[-1,1]){const hx=px+d*(bw/2+2),hy=bt+1;x.fillStyle='#f7b58f';x.strokeStyle='#733f2b';x.lineWidth=1.8;x.beginPath();x.ellipse(hx,hy,10,9,-d*.12,0,Math.PI*2);x.fill();x.stroke();x.strokeStyle='#c47a5a';x.lineWidth=1;for(let k=-2;k<=2;k++){x.beginPath();x.moveTo(hx+d*2,hy+k*2);x.lineTo(hx+d*7,hy+k*1.7);x.stroke()}}
  // arms behind basket, visible toward hands
  for(const d of[-1,1]){x.strokeStyle='#0d2f83';x.lineWidth=11;x.lineCap='round';x.beginPath();x.moveTo(px+d*20,bt+25);x.lineTo(px+d*38,bt+8);x.stroke();}
  x.restore();
  // Power timers
  x.textAlign='left';x.textBaseline='alphabetic';x.font='bold 13px Arial';x.fillStyle='#08376d';if(mag>0)x.fillText('MAGNET '+mag.toFixed(0)+'s',8,19);if(dbl>0)x.fillText('DOUBLE x2 '+dbl.toFixed(0)+'s',8,mag>0?37:19);
  if(banner>0){x.textAlign='center';x.font='bold 30px Arial';x.globalAlpha=Math.min(1,banner);x.fillStyle='#fff';x.strokeStyle='#0b4b9d';x.lineWidth=5;x.strokeText('LEVEL '+lvl,W/2,H/2);x.fillText('LEVEL '+lvl,W/2,H/2);x.globalAlpha=1}
}
function setT(e){const r=cv.getBoundingClientRect();target=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{setT(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setT(e)});
const hold=(id,d)=>{const b=$(id);b.addEventListener('pointerdown',()=>{target=null;dir=d});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{if(dir===d)dir=0}))};
hold('L',-1);hold('R',1);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('selectstart',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){target=null;dir=-1}if(e.key==='ArrowRight'){target=null;dir=1}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')dir=0});
img.onload=()=>{reset();draw()};
</script>
</body>
</html>
